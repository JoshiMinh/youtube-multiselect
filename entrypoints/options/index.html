<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="manifest.open_in_tab" content="true" />
    <title>Youtube Multiselect</title>
    <link href="../../assets/options.css" rel="stylesheet" />
  </head>
  <body id="options">
    <header class="page-header">
      <div class="page-header-inner">
        <a class="brand" href="#settings" data-aria="extensionName">
          <img src="/icons/48.png" alt="" width="32" height="32" />
          <span class="page-title" data-text="extensionName"></span>
        </a>
        <nav data-aria="optionsSections">
          <a href="#settings" data-text="tabSettings"></a>
          <a href="#shortcuts" data-text="tabShortcuts"></a>
        </nav>
      </div>
    </header>

    <main>
      <section id="settings" class="page-section settings">
        <div class="section-heading">
          <p class="eyebrow" data-text="settingsEyebrow"></p>
          <h1 data-text="settingsTitle"></h1>
          <p class="section-intro" data-text="settingsIntro"></p>
        </div>
        <div class="settings-layout">
          <div class="settings-card">
            <div class="card-heading">
              <span class="card-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3a2 2 0 0 1 2 2v1.1a6.9 6.9 0 0 1 1.7 1l.95-.55a2 2 0 1 1 2 3.46l-.95.55a7 7 0 0 1 0 2l.95.55a2 2 0 1 1-2 3.46l-.95-.55a6.9 6.9 0 0 1-1.7 1V19a2 2 0 1 1-4 0v-1.1a6.9 6.9 0 0 1-1.7-1l-.95.55a2 2 0 1 1-2-3.46l.95-.55a7 7 0 0 1 0-2l-.95-.55a2 2 0 1 1 2-3.46l.95.55a6.9 6.9 0 0 1 1.7-1V5a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </span>
              <div>
                <h2 data-text="settingsGeneral"></h2>
                <p data-text="settingsGeneralDescription"></p>
              </div>
            </div>
            <div class="settings-slot"></div>
          </div>
          <aside class="info-card">
            <img src="/icons/logo.svg" alt="" width="48" height="48" />
            <h2 data-text="extensionName"></h2>
            <p data-text="extensionDescription"></p>
            <p class="muted" data-text="languageNotice"></p>
          </aside>
        </div>
      </section>

      <section id="shortcuts" class="page-section">
        <div class="section-heading">
          <p class="eyebrow" data-text="shortcutsEyebrow"></p>
          <h1 data-text="shortcutsTitle"></h1>
          <p class="section-intro" data-text="shortcutsIntro"></p>
        </div>
        <div class="shortcut-card">
          <div class="shortcut-group">
            <h2 data-text="shortcutsHeadline1"></h2>
            <div class="shortcut-row"><kbd data-text="home"></kbd><span data-text="kbFocusFirstVideo"></span></div>
            <div class="shortcut-row"><kbd data-text="end"></kbd><span data-text="kbFocusLastVideo"></span></div>
            <div class="shortcut-row"><kbd>↑</kbd> <kbd>↓</kbd><span data-text="kbFocusAboveVideo"></span></div>
            <div class="shortcut-row"><kbd data-text="ctrl"></kbd>+<kbd>A</kbd><span data-text="kbToggleAllVideos"></span></div>
            <div class="shortcut-row"><kbd data-text="ctrl"></kbd>+<kbd>C</kbd><span data-text="kbCopySelectedVideos"></span></div>
            <div class="shortcut-row"><kbd data-text="ctrl"></kbd>+<kbd>V</kbd><span data-text="kbPasteVideos"></span></div>
            <div class="shortcut-row"><kbd data-text="del"></kbd><span data-text="kbDeleteSelectedVideos"></span></div>
          </div>
          <div class="shortcut-group">
            <h2 data-text="shortcutsHeadline2"></h2>
            <div class="shortcut-row"><kbd>↑</kbd> <kbd>↓</kbd><span data-text="kbFocusPreviousMenuItem"></span></div>
            <div class="shortcut-row"><kbd>↵</kbd><span data-text="kbActivateFocusedMenuItem"></span></div>
            <div class="shortcut-row"><kbd data-text="esc"></kbd><span data-text="kbCloseMenu"></span></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="../../src/options.js"></script>
  </body>
</html>
